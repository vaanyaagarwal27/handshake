openapi: "3.0.3"
info:
  title: Food Order Tracking API
  version: "1"

paths:
  /orders:
    get:
      summary: List orders (paginated)
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Page number (1-based)
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
          description: Number of orders per page
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                type: object
                required: [orders, page, limit, total]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  page:
                    type: integer
                    description: Current page number
                  limit:
                    type: integer
                    description: Orders per page
                  total:
                    type: integer
                    description: Total number of orders across all pages

components:
  schemas:
    Order:
      type: object
      required: [id, item, status, eta]
      properties:
        id:
          type: integer
        item:
          type: string
        status:
          type: string
          enum:
            - preparing
            - on the way
            - delivered
        eta:
          type: string
          format: date-time
          description: Estimated arrival time as ISO 8601 timestamp (e.g. 2026-11-07T19:19:00+05:30)
