openapi: 3.0.3
info:
  title: Orders API
  version: "1"
paths:
  /orders:
    get:
      summary: List orders (paginated)
      parameters:
        - name: page
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
            example: 10
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                type: object
                required:
                  - orders
                  - page
                  - limit
                  - total
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  total:
                    type: integer
                    example: 5
components:
  schemas:
    Order:
      type: object
      required:
        - id
        - item
        - status
        - eta
      properties:
        id:
          type: integer
          example: 2
        item:
          type: string
          example: Chicken Biryani
        status:
          type: string
          enum:
            - preparing
            - on the way
            - delivered
          example: on the way
        eta:
          type: string
          format: date-time
          example: "2026-11-05T19:15:00+05:30"
